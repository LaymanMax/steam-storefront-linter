name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust (Format, Clippy, Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies & build
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --tests -- -D warnings

      - name: Run unit tests
        run: cargo test --lib --workspace

      - name: Run integration tests
        run: cargo test --tests --workspace

      - name: Build release binaries
        run: cargo build --release

      - name: Validate sample benchmark generation & CLI audit
        run: |
          cargo run -p linter-cli -- dataset sample
          cargo run -p linter-cli -- audit --input data/fixtures/valid_indie_game.json --format terminal

  web-check:
    name: Web Frontend (TypeScript, Tests, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (lint)
        run: pnpm --filter web lint

      - name: Run frontend unit tests
        run: pnpm --filter web test -- --run

      - name: Build frontend production bundle
        run: pnpm --filter web build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: steam-storefront-linter:latest
