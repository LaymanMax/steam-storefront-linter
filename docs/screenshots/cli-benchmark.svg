  <text x="24" y="196" class="term-text" xml:space="preserve"><tspan fill="#cbd5e1">Explanation:    Broadened cohort: included games across all release years sharing primary genres.</tspan></text>
  <text x="24" y="236" class="term-text" xml:space="preserve"><tspan fill="#cbd5e1" font-weight="bold">Metric Distributions:</tspan></text>
