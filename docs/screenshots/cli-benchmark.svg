  <text x="24" y="316" class="term-text" xml:space="preserve"><tspan fill="#cbd5e1">  - Detailed Description Word Count Median: 318  IQR: [210 - 449] Range: [126 - 548] (82 usable)</tspan></text>
  <text x="24" y="336" class="term-text" xml:space="preserve"><tspan fill="#cbd5e1">  - Short Description Word Count   Median: 39   IQR: [28 - 47] Range: [20 - 56] (82 usable)</tspan></text>
  <text x="24" y="356" class="term-text" xml:space="preserve"><tspan fill="#cbd5e1">  - Supported Interface Languages  Median: 6    IQR: [3 - 9] Range: [1 - 11] (82 usable)</tspan></text>
