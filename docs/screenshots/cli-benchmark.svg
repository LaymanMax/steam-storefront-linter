  <text x="24" y="76" class="term-text" xml:space="preserve"><tspan fill="#10b981" font-weight="bold">$</tspan> <tspan fill="#ffffff" font-weight="bold">steam-storefront-linter benchmark inspect --genre Action --year 2024 --indie</tspan></text>
